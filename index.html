<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Phantom Roster · P5X Team Builder</title>
    <meta name="description" content="Persona 5: The Phantom X Global units and team builder with turn order and synergy highlights." />
    <script>
      // Apply the chosen look before first paint (?look=<id> or the saved one).
      try {
        var q = new URLSearchParams(location.search).get('look');
        var l = q || localStorage.getItem('p5x-look');
        if (q) localStorage.setItem('p5x-look', q);
        if (l && l !== 'phantom') document.documentElement.dataset.look = l;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bowlby+One&family=DM+Serif+Display&family=Noto+Sans:wght@500;700;900&family=Rubik+Mono+One&family=Inter:wght@400;600;800&family=Oswald:wght@500;600;700&family=Cormorant+Garamond:wght@600;700&family=Playfair+Display:wght@800;900&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
